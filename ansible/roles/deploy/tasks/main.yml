---
- name: Apply Kubernetes Secret dynamically
  kubernetes.core.k8s:
    state: present
    namespace: default
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: fake-news-secrets
      type: Opaque
      data:
        vault-token: "{{ lookup('env', 'VAULT_TOKEN') | default('dev-only-token', true) | b64encode }}"
        jenkins-user: "{{ lookup('env', 'JENKINS_USER') | default('admin', true) | b64encode }}"
        jenkins-pass: "{{ lookup('env', 'JENKINS_PASS') | b64encode }}"

- name: Apply Kubernetes Deployment, Service, and HPA
  kubernetes.core.k8s:
    state: present
    namespace: default
    definition: "{{ lookup('file', '../../../../k8s/' + item) | from_yaml }}"
  loop:
    - db-pvc.yaml
    - deployment.yaml
    - service.yaml
    - hpa.yaml

- name: Force Rollout of Deployment to pick up new image
  command: kubectl rollout restart deployment fake-news-api


